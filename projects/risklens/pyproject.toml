[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risklens-demo"
version = "0.1.0"
description = "Explainable portfolio risk and pre-trade compliance research demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<4"]

[project.scripts]
risklens = "risklens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
