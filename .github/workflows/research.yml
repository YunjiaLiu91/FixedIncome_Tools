name: research checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
        project: [risklens, pit-alpha]
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - if: matrix.project == 'risklens'
        run: risklens demo --output outputs/ci-demo
      - if: matrix.project == 'pit-alpha'
        run: fundamental-alpha demo --output outputs/ci-demo
